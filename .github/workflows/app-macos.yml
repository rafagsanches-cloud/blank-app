name: App macOS (Chuva SP)

on:
  push:
    branches: [claude/happy-brahmagupta-udhdxu]
    paths: ["macos/**", ".github/workflows/app-macos.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-macos-26
  cancel-in-progress: true

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Actions ativo neste repositório"

  construir:
    strategy:
      fail-fast: false
      matrix:
        imagem: [macos-26]
    runs-on: ${{ matrix.imagem }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ambiente
        run: |
          sw_vers
          swiftc --version

      - name: Testar os cálculos (comparação com o ClimdexSP em R)
        run: bash macos/testar_calculos.sh

      - name: Compilar o app
        run: bash macos/construir_app.sh

      - name: Capturas de tela de cada aba
        run: |
          mkdir -p capturas
          "macos/build/Chuva SP.app/Contents/MacOS/ChuvaSP" --capturas "$PWD/capturas"
          ls -la capturas

      - name: Abrir o app de verdade (janelas)
        continue-on-error: true
        run: |
          APP="macos/build/Chuva SP.app"
          for ABA in visaoGeral mapa extremos postos ana; do
            open -n "$APP" --args --aba "$ABA" --regiao UGRHI13
            sleep 9
            pgrep -fl ChuvaSP || echo "app não está rodando"
            screencapture -x "capturas/0_janela_$ABA.png" || true
            pkill -f "Chuva SP.app/Contents/MacOS/ChuvaSP" || true
            sleep 2
          done

      - name: Guardar o app e as capturas
        if: always()
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Chuva-SP-macOS-${{ matrix.imagem }}
          path: |
            macos/build/Chuva-SP-macOS.zip
            capturas/*.png
          if-no-files-found: warn

      - name: Publicar versão para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # as duas imagens compilam o mesmo código; publica só a primeira que terminar
          if gh release view app-macos --json targetCommitish -q .targetCommitish 2>/dev/null | grep -q "$GITHUB_SHA"; then
            echo "versão deste commit já publicada"; exit 0
          fi
          gh release delete app-macos --yes --cleanup-tag || true
          gh release create app-macos --prerelease --target "$GITHUB_SHA" \
            --title "Chuva SP para macOS" --notes-file macos/NOTAS_VERSAO.md \
            macos/build/Chuva-SP-macOS.zip capturas/*.png
